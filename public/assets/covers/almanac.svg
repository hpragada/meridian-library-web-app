<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="presentation">
  <rect width="400" height="600" fill="#f2ece0"/>
  <!-- sea and sky behind -->
  <rect width="400" height="240" fill="#cfe0e8"/>
  <rect y="240" width="400" height="360" fill="#e8e1d3"/>

  <!-- lighthouse on the right -->
  <g>
    <path d="M300 250 L286 96 h48 L320 250z" fill="#f7f4ee" stroke="#8a8377" stroke-width="2"/>
    <g fill="#b23a2c">
      <path d="M292 154 h36 l2 24 h-40z"/>
      <path d="M288 206 h44 l2 24 h-48z"/>
    </g>
    <rect x="282" y="76" width="56" height="22" fill="#4a5560"/>
    <rect x="292" y="52" width="36" height="24" fill="#ffe9a8" stroke="#4a5560" stroke-width="2"/>
    <path d="M286 44 l24 -18 24 18z" fill="#4a5560"/>
    <rect x="272" y="250" width="76" height="12" fill="#8a8377"/>
  </g>

  <!-- the tide table, a printed grid of times and heights -->
  <g>
    <rect x="34" y="286" width="220" height="248" fill="#ffffff" stroke="#8a8377" stroke-width="2"/>
    <g stroke="#c8c1b2" stroke-width="1.5">
      <path d="M34 322 H254 M34 358 H254 M34 394 H254 M34 430 H254 M34 466 H254 M34 500 H254"/>
      <path d="M124 286 V534 M190 286 V534"/>
    </g>
    <g fill="#5b5346" font-family="Georgia, serif" font-size="15">
      <text x="46" y="312">Day</text><text x="134" y="312">High</text><text x="200" y="312">Low</text>
      <text x="46" y="348">Mon</text><text x="134" y="348">04:12</text><text x="200" y="348">10:38</text>
      <text x="46" y="384">Tue</text><text x="134" y="384">05:01</text><text x="200" y="384">11:24</text>
      <text x="46" y="420">Wed</text><text x="134" y="420">05:47</text><text x="200" y="420">12:09</text>
      <text x="46" y="456">Thu</text><text x="134" y="456">06:33</text><text x="200" y="456">12:52</text>
      <text x="46" y="492">Fri</text><text x="134" y="492">07:20</text><text x="200" y="492">13:36</text>
      <text x="46" y="524">Sat</text><text x="134" y="524">08:09</text><text x="200" y="524">14:21</text>
    </g>
  </g>

  <text x="200" y="180" font-family="Georgia, serif" font-size="31" fill="#2b3a4a"
        text-anchor="middle">The Coastal Almanac</text>
  <text x="200" y="214" font-family="Georgia, serif" font-size="18" fill="#2b3a4a"
        opacity="0.85" text-anchor="middle">Sena Karadeniz</text>
</svg>
