<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="presentation">
  <rect width="400" height="600" fill="#2f3540"/>
  <rect width="400" height="330" fill="#48505c"/>
  <!-- embankment -->
  <rect y="330" width="400" height="270" fill="#3a4049"/>
  <!-- empty track running to the bottom edge -->
  <g>
    <path d="M120 330 L20 600" stroke="#8e97a3" stroke-width="7"/>
    <path d="M190 330 L300 600" stroke="#8e97a3" stroke-width="7"/>
    <g stroke="#5a6270" stroke-width="6">
      <path d="M118 350 H196"/><path d="M110 396 H212"/><path d="M100 452 H232"/>
      <path d="M88 516 H256"/><path d="M74 588 H284"/>
    </g>
  </g>
  <!-- signal box: raised timber cabin with a long window band -->
  <g>
    <rect x="238" y="196" width="130" height="112" fill="#6b4a33"/>
    <rect x="246" y="212" width="114" height="46" fill="#c8d6df"/>
    <g stroke="#6b4a33" stroke-width="4">
      <path d="M284 212 V258 M322 212 V258"/>
    </g>
    <path d="M230 196 L303 158 L376 196z" fill="#2b3038"/>
    <rect x="252" y="272" width="26" height="36" fill="#3f2c1f"/>
    <!-- steps up to the door -->
    <g fill="#5a3f2c">
      <rect x="220" y="308" width="34" height="8"/>
      <rect x="212" y="322" width="34" height="8"/>
      <rect x="204" y="336" width="34" height="8"/>
    </g>
    <rect x="238" y="308" width="130" height="8" fill="#4d3626"/>
  </g>
  <!-- signal post beside the line, arm down -->
  <rect x="150" y="180" width="6" height="160" fill="#22262d"/>
  <rect x="156" y="196" width="44" height="10" fill="#b23a2c"/>

  <text x="200" y="470" font-family="Georgia, serif" font-size="33" fill="#ffffff"
        text-anchor="middle">The Signal Box</text>
  <text x="200" y="506" font-family="Georgia, serif" font-size="19" fill="#ffffff"
        opacity="0.85" text-anchor="middle">Ruth Anwyl</text>
</svg>
