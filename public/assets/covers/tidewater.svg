<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="presentation">
  <rect width="400" height="600" fill="#2b3a4a"/>
  
  <defs><linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a5c72"/><stop offset="0.55" stop-color="#c98a5e"/>
    <stop offset="1" stop-color="#2b3a4a"/></linearGradient></defs>
  <rect width="400" height="300" fill="url(#dusk)"/>
  <circle cx="300" cy="235" r="26" fill="#f0c08a"/>
  <!-- far quay wall, half submerged -->
  <rect x="0" y="250" width="400" height="18" fill="#1f2a36"/>
  <!-- flooded water -->
  <rect x="0" y="268" width="400" height="332" fill="#33465a"/>
  <path d="M0 268 h400 v40 H0z" fill="#3d5268" opacity="0.7"/>
  <!-- moored boats, hulls low in the water -->
  <path d="M60 300 l70 0 -12 26 -46 0z" fill="#16202a"/>
  <rect x="92" y="256" width="3" height="44" fill="#16202a"/>
  <path d="M200 312 l86 0 -15 30 -56 0z" fill="#16202a"/>
  <rect x="240" y="262" width="3" height="50" fill="#16202a"/>
  <!-- half-drowned mooring posts -->
  <rect x="30" y="284" width="8" height="60" fill="#101820"/>
  <rect x="330" y="292" width="8" height="52" fill="#101820"/>
  <!-- reflections -->
  <rect x="292" y="330" width="16" height="90" fill="#f0c08a" opacity="0.22"/>
  <rect x="60" y="346" width="70" height="6" fill="#ffffff" opacity="0.12"/>
  <rect x="210" y="380" width="70" height="6" fill="#ffffff" opacity="0.1"/>

  <text x="200" y="500" font-family="Georgia, serif" font-size="34" fill="#ffffff"
        text-anchor="middle">Tidewater</text>
  <text x="200" y="536" font-family="Georgia, serif" font-size="20" fill="#ffffff"
        opacity="0.85" text-anchor="middle">Ursula Vane</text>
</svg>
